plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.antifraud'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.antifraud"
        minSdk 24
        targetSdk 37
        versionCode 56
        versionName "5.6"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 刻意不加任何第三方依赖：零依赖 = 编译快、安装包小、答辩好讲
dependencies {
}
